<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Data Twist!</title>

    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ── BLE participant cards ───────────────── */
        .ble-card {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            border: 2px solid #adb5bd;
            background: #fff;
            color: #6c757d;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .ble-card:hover { border-color: #495057; color: #212529; }
        .ble-card.connecting { border-color: #ffc107; color: #ffc107; }
        .ble-card.connected  { background: #22c55e; border-color: #22c55e; color: #fff; }

        /* ── Full-screen color flash ─────────────── */
        #viz-flash {
            position: fixed;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            z-index: 900;
            transition: opacity 0.25s ease-in;
        }
        #viz-flash.viz-flash--on {
            opacity: 1;
            transition: opacity 0.25s ease-in, opacity 0.4s 0.25s ease-out;
        }

        /* ── Visualization overlay ───────────────── */
        #viz-overlay {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            z-index: 800;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            cursor: pointer;
        }
        #viz-overlay.viz-overlay--active {
            opacity: 1;
            pointer-events: all;
        }
        #viz-chart {
            width: 100%;
            height: 100%;
        }

        /* ── Constrain orientation image ────────── */
        [id="orientation img"] {
            max-width: 380px;
            max-height: 52vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="slide-container">

        <!-- ── Slide 1: Welcome ──────────────────── -->
        <div class="slide active" id="slide-1">
            <h1 class="display-1 fw-bold" style="margin:0; padding:0;">The Data Twist!</h1>
            <p class="fs-3 text-muted mt-3" style="margin:0; padding:0;">Maryland Day &mdash; April 25, 2026</p>
            <button id="slide-next" class="btn btn-dark slide-btn-next" aria-label="Next slide">&#8250;</button>
        </div>

        <!-- ── Slide 2: Game Setup ───────────────── -->
        <div class="slide" id="slide-2">
            <div class="game-page-grid">

                <!-- Row 1: title + credits -->
                <div class="game-pg-header">
                    <h2 id="game-title" style="font-size:2.5rem; font-weight:700; margin:0; padding:0;"></h2>
                    <p id="game-credits" style="color:#6c757d; font-style:italic; margin:0.25rem 0 0; padding:0; font-size:1.4rem;"></p>
                </div>

                <!-- Row 2: image | orientation | rules -->
                <div class="game-pg-col">
                    <img id="orientation img" alt="">
                </div>
                <div class="game-pg-col">
                    <h5 class="fw-bold mb-2" style="letter-spacing:1px;">ORIENTATION</h5>
                    <p id="orientation" style="font-size:0.95rem;"></p>
                </div>
                <div class="game-pg-col">
                    <h5 class="fw-bold mb-2" style="letter-spacing:1px;">RULES</h5>
                    <p id="instruction" style="font-size:0.95rem;"></p>
                </div>

                <!-- Row 3: play + next game -->
                <div class="game-pg-footer">
                    <button id="btn-play" class="btn btn-dark btn-lg" type="button">play</button>
                    <button id="btn-next-game" class="btn btn-dark btn-lg" type="button">next game</button>
                </div>

            </div>

            <!-- Hidden: still needed for JS game-cycling logic -->
            <button id="orient button" style="display:none;" type="button">game</button>
        </div>

        <!-- ── Slide 3: Connect (Compass only) ──────── -->
        <div class="slide" id="slide-3">
            <h2 class="fw-bold mb-2" style="letter-spacing:1px;">CONNECT PARTICIPANTS</h2>
            <p class="text-muted mb-4">Click each card to pair a board via Bluetooth.</p>
            <div id="ble-panel" class="text-center">
                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <button id="connect-p1" class="ble-card" type="button">P1</button>
                    <button id="connect-p2" class="ble-card" type="button">P2</button>
                    <button id="connect-p3" class="ble-card" type="button">P3</button>
                    <button id="connect-p4" class="ble-card" type="button">P4</button>
                    <button id="connect-p5" class="ble-card" type="button">P5</button>
                    <button id="connect-p6" class="ble-card" type="button">P6</button>
                    <button id="connect-p7" class="ble-card" type="button">P7</button>
                    <button id="connect-p8" class="ble-card" type="button">P8</button>
                </div>
            </div>
            <button id="btn-connect-next" class="btn btn-dark slide-btn-next" aria-label="Next slide">&#8250;</button>
            <button id="btn-connect-prev" class="btn btn-dark slide-btn-prev" aria-label="Previous slide">&#8249;</button>
        </div>

        <!-- ── Slide 4: Play ─────────────────────── -->
        <div class="slide" id="slide-4">
            <div class="spin-layout">
                <div class="spin-col-image">
                    <img id="orientation-img-s3" alt="" style="max-height:52vh; max-width:100%; object-fit:contain;">
                </div>
                <div class="spin-col-content">
                    <button id="spin button" class="btn btn-dark btn-lg mb-3" type="button">spin</button>
                    <h1 id="body part" class="game card mb-2" style="margin:0; padding:0.5rem 1rem;"></h1>
                    <h1 id="statement" class="game card text-center mb-3" style="font-size:2.4rem; max-width:700px; margin:0 0 1rem; padding:0.5rem 1.5rem;"></h1>
                    <span id="countdown" style="font-size:4rem; line-height:1; font-weight:bold; display:block;"></span>
                </div>
            </div>
            <button id="slide-prev" class="btn btn-dark slide-btn-prev" aria-label="Previous slide">&#8249;</button>
        </div>

    </div><!-- /.slide-container -->

    <!-- Captions (fixed bottom-left, outside slides) -->
    <p id="captions" style="position:fixed; bottom:1rem; left:1rem; margin:0; padding:0; z-index:100; font-size:1.875rem;"></p>

    <!-- Color flash layer -->
    <div id="viz-flash"></div>

    <!-- Visualization overlay -->
    <div id="viz-overlay">
        <div id="viz-chart"></div>
    </div>


    <!-- Load JS libraries -->
    <script src="js/d3.v7.js"></script>
    <script src="js/bootstrap.bundle.js"></script>

    <script>
        var data = [];
        var statements = [];
        var pickedStatements = [];
        var parts = [];
        var pickedParts = [];
        var counter = 1;
        var setsOfParts = [];
        var orientations = [];
        var orientationImages = [];
        var orientationImagesAlt = [];
        var instructions = [];
        var choreographicDesigners = [];

        setupFormData();

        async function setupFormData() {
            let gamesSheet, statementsSheet;
            try {
                gamesSheet = await d3.csv("https://docs.google.com/spreadsheets/d/e/2PACX-1vRnJlmWn0MRDb6Y_RDqIOMoWdNVzMUEee0bBXZGgC81hMdIW7pJqoaOV3xNScpUPDgKQVikPq2QgwSH/pub?gid=0&single=true&output=csv");
                statementsSheet = await d3.csv("https://docs.google.com/spreadsheets/d/e/2PACX-1vSxH77DQSRxY-FZ3usmxD4lBTc6dfPNRk7cehZT6Nu1NUsa4fuhnkkdvmcFHc8lDCspekEMxGMIVryU/pub?gid=1476223550&single=true&output=csv");
            } catch (error) {
                console.log("error loading sheets from urls", error);
            }

            statementsSheet.forEach(function (row) {
                const stronglyAgree    = row["Write a PERSONAL statement you STRONGLY AGREE with. For example, my mother accepts me for who I am."];
                const somewhatAgree    = row["Write a CASUAL statement you SOMEWHAT AGREE with. For example, Training wheels do not train balance so are best skipped when learning to ride a bike."];
                const somewhatDisagree = row["Write a PLAYFUL statement you SOMEWHAT DISAGREE with. For example, stinkier cheese has more flavor than milder smelling cheese."];
                const stronglyDisagree = row["Write a THORNY statement you STRONGLY DISAGREE with. For example, Art funding is unnecessary with the influx of NFTs. No inflammatory statements please."];

                if (stronglyAgree    && stronglyAgree.trim()    !== "" && !stronglyAgree.includes('?'))    statements.push(stronglyAgree);
                if (somewhatAgree    && somewhatAgree.trim()    !== "" && !somewhatAgree.includes('?'))    statements.push(somewhatAgree);
                if (somewhatDisagree && somewhatDisagree.trim() !== "" && !somewhatDisagree.includes('?')) statements.push(somewhatDisagree);
                if (stronglyDisagree && stronglyDisagree.trim() !== "" && !stronglyDisagree.includes('?')) statements.push(stronglyDisagree);
            });

            const bodyPartsMap = {
                "Twister Reimagined": ["right hand", "left hand", "right foot", "left foot"],
                "Urban Interchange":  ["right hand", "left hand", "right foot", "left foot", "right elbow", "left elbow", "ribs", "nose"]
            };

            const gameImageMap = {
                "Compass":                        "img/Compass.jpg",
                "Twister Reimagined":             "img/TwisterReimagined.png",
                "Urban Interchange":              "img/UrbanInterchanges.png",
                "School Day":                     "img/SchoolDay.png",
                "Head, Shoulders, Knees, & Toes": "img/HeadShouldersKneesToes.png",
                "States of Matter":               "img/StatesOfMatterTemp.png"
            };

            gamesSheet.forEach(function (gameRow) {
                const gameName       = gameRow.game;
                const orientation    = gameRow.orientation;
                const rules          = gameRow.rules;
                const designers      = gameRow["choreographic designers"] || "";
                const visualKeyUrl   = gameImageMap[gameName] || "img/qr.png";
                const bodyPartFlag   = gameRow["body part"];

                let bodyParts = [];
                if (bodyPartFlag === "on" && bodyPartsMap[gameName]) {
                    bodyParts = bodyPartsMap[gameName];
                }

                if (gameName) {
                    setsOfParts.push(bodyParts);
                    orientations.push(orientation);
                    orientationImages.push(visualKeyUrl);
                    orientationImagesAlt.push(gameName);
                    instructions.push(rules);
                    choreographicDesigners.push(designers);
                }
            });

            setupArrays();
            printGameCards();
        }

        function setupArrays() {
            if (setsOfParts.length > 0) {
                parts = setsOfParts[0];
            }
        }

        function printGameCards() {
            document.getElementById("orientation img").src = orientationImages[0];
            document.getElementById("orientation img").alt = orientationImagesAlt[0];
            syncGameImage(orientationImages[0], orientationImagesAlt[0]);
            updateGameHeader(0);
            document.getElementById("orientation").innerHTML  = orientations[0];
            document.getElementById("instruction").innerHTML  = instructions[0];

            parts = setsOfParts[0];
            updateBodyPartDisplay();
            document.getElementById("statement").innerHTML = picker("statement");

            document.getElementById("spin button").addEventListener("click", function (event) {
                let statement = picker("statement");
                let part = "";
                if (parts.length > 0) {
                    part = picker("part");
                    speakText(part);
                }
                speakText(statement);
                document.getElementById("body part").innerHTML  = part;
                document.getElementById("statement").innerHTML  = statement;
            });

            document.getElementById("orient button").addEventListener("click", function (event) {
                if (counter < orientations.length) {
                    document.getElementById("orientation img").src = orientationImages[counter];
                    document.getElementById("orientation img").alt = orientationImagesAlt[counter];
                    syncGameImage(orientationImages[counter], orientationImagesAlt[counter]);
                    updateGameHeader(counter);
                    document.getElementById("orientation").innerHTML  = orientations[counter];
                    document.getElementById("instruction").innerHTML  = instructions[counter];
                    pickedParts = [];
                    parts = setsOfParts[counter];
                    updateBodyPartDisplay();
                    document.getElementById("statement").innerHTML = picker("statement");
                    counter++;
                }
                if (counter === orientations.length) {
                    counter = 0;
                }
            });
        }

        function syncGameImage(src, alt) {
            const s3img = document.getElementById("orientation-img-s3");
            if (s3img) { s3img.src = src; s3img.alt = alt; }
        }

        function updateGameHeader(index) {
            const titleEl   = document.getElementById("game-title");
            const creditsEl = document.getElementById("game-credits");
            if (titleEl)   titleEl.textContent   = orientationImagesAlt[index].toUpperCase();
            if (creditsEl) creditsEl.textContent = choreographicDesigners[index] || '';
        }

        function updateBodyPartDisplay() {
            const bodyPartEl = document.getElementById("body part");
            if (parts.length > 0) {
                bodyPartEl.style.display = "";
                bodyPartEl.innerHTML = picker("part");
            } else {
                bodyPartEl.style.display = "none";
                bodyPartEl.innerHTML = "";
            }
        }

        function speakText(text) {
            const speech = new SpeechSynthesisUtterance(text);
            const voices = speechSynthesis.getVoices();
            speech.lang  = "en-US";
            speech.rate  = 1;
            speech.pitch = 1;
            speech.voice = voices.find(voice => voice.name === "Google UK English Female");
            window.speechSynthesis.speak(speech);
        }

        function captionsOn() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.continuous = true;
            recognition.onresult = (event) => {
                let result;
                for (let i = 0; i < event.results.length; ++i) {
                    result = event.results[i][0].transcript;
                    document.getElementById("captions").textContent = result;
                }
            };
            recognition.start();
        }

        function grammarOn() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.continuous = true;
            recognition.onresult = (event) => {
                let result;
                for (let i = 0; i < event.results.length; ++i) {
                    result = event.results[i][0].transcript;
                    if (result === "game") {
                        if (counter < orientations.length) {
                            document.getElementById("orientation img").src = orientationImages[counter];
                            document.getElementById("orientation img").alt = orientationImagesAlt[counter];
                            syncGameImage(orientationImages[counter], orientationImagesAlt[counter]);
                            document.getElementById("orientation").innerHTML  = orientations[counter];
                            document.getElementById("instruction").innerHTML  = instructions[counter];
                            counter++;
                        }
                        if (counter === orientations.length) { counter = 0; }
                    } else if (result === "spin") {
                        let part      = picker("part");
                        let statement = picker("statement");
                        speakText(part);
                        speakText(statement);
                        document.getElementById("body part").innerHTML  = part;
                        document.getElementById("statement").innerHTML  = statement;
                    }
                }
            };
            recognition.start();
        }

        function picker(choice) {
            if (choice === "part") {
                let randomP = d3.randomInt(parts.length);
                let part = parts[randomP()];
                if (parts.length === pickedParts.length) pickedParts = [];
                while (part === "incomplete" || pickedParts.includes(part)) { part = parts[randomP()]; }
                pickedParts.push(part);
                return part;
            }
            if (choice === "statement") {
                let randomS   = d3.randomInt(statements.length);
                let statement = statements[randomS()];
                if (statements.length === pickedStatements.length) pickedStatements = [];
                while (statement === "incomplete" || pickedStatements.includes(statement)) { statement = statements[randomS()]; }
                pickedStatements.push(statement);
                return statement;
            }
        }
    </script>

    <!-- Brush stroke library — ESM build exposed to window for main.js -->
    <script type="module">
      import { getStroke } from './js/perfect-freehand.module.js';
      window.getStroke = getStroke;
    </script>
    <!-- Load my scripts -->
    <script src="js/main.js"></script>

    <!-- Slideshow navigation -->
    <script>
        (function () {
            const slides = Array.from(document.querySelectorAll('.slide'));
            let current = 0;

            // Slide indices
            const IDX_WELCOME  = 0;
            const IDX_GAME     = 1;
            const IDX_CONNECT  = 2; // Compass only
            const IDX_PLAY     = 3;

            function goTo(n) {
                slides[current].classList.remove('active');
                current = ((n % slides.length) + slides.length) % slides.length;
                slides[current].classList.add('active');
            }

            function isCompass() {
                return (typeof currentGame !== 'undefined' ? currentGame : 'COMPASS') === 'COMPASS';
            }

            // Slide 1: forward only
            document.getElementById('slide-next').addEventListener('click', () => goTo(IDX_GAME));

            // Slide 2: play (smart — skip connect for non-Compass), next game
            document.getElementById('btn-play').addEventListener('click', () =>
                goTo(isCompass() ? IDX_CONNECT : IDX_PLAY));
            document.getElementById('btn-next-game').addEventListener('click', () =>
                document.getElementById('orient button').click());

            // Slide 3: connect — forward to play, back to game
            document.getElementById('btn-connect-next').addEventListener('click', () => goTo(IDX_PLAY));
            document.getElementById('btn-connect-prev').addEventListener('click', () => goTo(IDX_GAME));

            // Slide 4: back — Compass goes to connect, others go to game
            document.getElementById('slide-prev').addEventListener('click', () =>
                goTo(isCompass() ? IDX_CONNECT : IDX_GAME));

            document.addEventListener('keydown', (e) => {
                // Don't hijack keys while viz overlay is open
                if (document.getElementById('viz-overlay').classList.contains('viz-overlay--active')) return;
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
                if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(current - 1);
            });
        })();
    </script>

</body>
</html>
